<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投递准备模板 · Suze Flow</title>
  <link rel="stylesheet" href="career.css">
</head>
<body>
  <header class="career-header">
    <div class="career-topbar">
      <a class="career-back" href="../index.html#career">← 返回求职模式</a>
      <a class="career-brand" href="../index.html#career" aria-label="Suze Flow 求职模式">Suze <span>Flow</span></a>
    </div>
  </header>
  <main class="career-main">
    <section class="career-panel" aria-labelledby="pageTitle">
      <div class="career-page-head"><h1 id="pageTitle">投递准备模板</h1><p>整理投递前需要核对的信息。</p></div>
      <nav class="career-tabs" aria-label="求职内部导航">
        <a href="jobs.html">岗位</a>
        <a href="companies.html">公司</a>
        <a href="resume.html">简历</a>
        <a href="interview.html">面试</a>
        <a href="apply.html" aria-current="page">投递</a>
        <a href="cases.html">案例</a>
      </nav>
      <aside class="template-notice" aria-label="模板使用说明"><strong>投递准备模板 · 暂未接入独立保存</strong><p>输入仅用于本页临时整理，刷新或离开页面可能丢失。正式岗位、投递状态和面试记录请在 Job Radar 中管理。</p><a class="career-button" href="jobs.html#jobRecordsTitle">进入 Job Radar →</a></aside>



      <section class="record-card" aria-label="投递记录卡片" data-template="true">
        <div class="record-card-head application-card-head">
          <div>
            <div class="record-kicker">准备模板</div>
            <h2>投递准备草稿</h2>
          </div>
          <label class="application-status">
            <span class="sr-only">当前状态</span>
            <select class="application-status-select" name="status">
              <option>待沟通</option>
              <option>已沟通</option>
              <option>已投递</option>
              <option>面试中</option>
              <option>Offer</option>
              <option>淘汰</option>
            </select>
          </label>
        </div>

        <div class="record-grid">
          <label class="record-field">
            <span>公司名称</span>
            <input type="text" name="company" placeholder="填写公司名称" autocomplete="organization">
          </label>

          <label class="record-field">
            <span>岗位名称</span>
            <input type="text" name="position" placeholder="填写投递岗位" autocomplete="organization-title">
          </label>

          <label class="record-field">
            <span>投递日期</span>
            <input type="date" name="application-date">
          </label>

          <label class="record-field">
            <span>投递渠道</span>
            <select name="channel">
              <option value="">选择投递渠道</option>
              <option>BOSS</option>
              <option>猎聘</option>
              <option>拉勾</option>
              <option>官网</option>
              <option>内推</option>
            </select>
          </label>

          <label class="record-field record-field-wide">
            <span>JD 链接</span>
            <input type="url" name="jd-link" placeholder="https://..." inputmode="url">
          </label>

          <label class="record-field">
            <span>使用简历版本</span>
            <input type="text" name="resume-version" placeholder="例如：内容运营简历 V3">
          </label>

          <label class="record-field">
            <span>联系人</span>
            <input type="text" name="contact" placeholder="填写 HR、内推人或业务联系人" autocomplete="name">
          </label>

          <label class="record-field">
            <span>薪资范围</span>
            <input type="text" name="salary-range" placeholder="例如：20K–30K">
          </label>

          <label class="record-field">
            <span>匹配度评分</span>
            <input type="number" name="match-score" min="0" max="100" step="1" inputmode="numeric" placeholder="0–100">
          </label>
        </div>

        <div class="application-channel-wrap">
          <div class="application-channel-title">常用投递渠道</div>
          <div class="application-channels" aria-label="投递渠道">
            <span class="application-channel application-channel-active">BOSS</span>
            <span class="application-channel">猎聘</span>
            <span class="application-channel">拉勾</span>
            <span class="application-channel">官网</span>
            <span class="application-channel">内推</span>
          </div>
        </div>

        <section class="application-review" aria-labelledby="application-review-title">
          <div class="application-review-head">
            <div class="application-review-kicker">投递复盘</div>
            <h3 id="application-review-title">投递复盘</h3>
          </div>
          <div class="record-grid">
            <label class="record-field record-field-wide">
              <span>沟通与反馈记录</span>
              <textarea name="communication-notes" placeholder="记录投递反馈、沟通要点和岗位信息变化"></textarea>
            </label>
            <label class="record-field record-field-wide">
              <span>下一步动作</span>
              <textarea name="next-action" placeholder="记录跟进时间、准备事项或后续面试动作"></textarea>
            </label>
          </div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
