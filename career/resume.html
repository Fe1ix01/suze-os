<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历版本模板 · Suze Flow</title>
  <link rel="stylesheet" href="career.css">
</head>
<body>
  <header class="career-header">
    <div class="career-topbar">
      <a class="career-back" href="../index.html#career">← 返回求职模式</a>
      <a class="career-brand" href="../index.html#career" aria-label="Suze Flow 求职模式">Suze <span>Flow</span></a>
    </div>
  </header>
  <main class="career-main">
    <section class="career-panel" aria-labelledby="pageTitle">
      <div class="career-page-head"><h1 id="pageTitle">简历版本模板</h1><p>梳理不同岗位方向的简历内容。</p></div>
      <nav class="career-tabs" aria-label="求职内部导航">
        <a href="jobs.html">岗位</a>
        <a href="companies.html">公司</a>
        <a href="resume.html" aria-current="page">简历</a>
        <a href="interview.html">面试</a>
        <a href="apply.html">投递</a>
        <a href="cases.html">案例</a>
      </nav>
      <aside class="template-notice" aria-label="模板使用说明"><strong>简历版本模板 · 暂未接入独立保存</strong><p>输入仅用于本页临时整理，刷新或离开页面可能丢失。正式岗位、投递状态和面试记录请在 Job Radar 中管理。</p><a class="career-button" href="jobs.html#jobRecordsTitle">进入 Job Radar →</a></aside>

      <section class="template-directions" aria-label="简历整理方向"><h2>整理方向</h2><p>按目标岗位填写下方模板；这里不提供版本历史或筛选功能。</p><div class="topic-tags"><span>内容运营</span><span>品牌营销</span><span>商务合作</span><span>项目管理</span></div></section>

      <section class="record-card" aria-label="简历版本卡片" data-template="true">
        <div class="record-card-head resume-card-head">
          <div>
            <div class="record-kicker">简历模板</div>
            <h2>简历版本卡片</h2>
          </div>
          <label class="resume-status">
            <span class="sr-only">当前状态</span>
            <select class="resume-status-select" name="status">
              <option>使用中</option>
              <option>待优化</option>
              <option>投递中</option>
              <option>已废弃</option>
            </select>
          </label>
        </div>

        <div class="record-grid">
          <label class="record-field">
            <span>简历名称</span>
            <input type="text" name="resume-name" placeholder="例如：内容运营简历 V3">
          </label>

          <label class="record-field">
            <span>修改日期</span>
            <input type="date" name="updated-at">
          </label>

          <label class="record-field">
            <span>目标岗位</span>
            <input type="text" name="target-role" placeholder="填写目标岗位" autocomplete="organization-title">
          </label>

          <label class="record-field">
            <span>适配公司</span>
            <input type="text" name="target-companies" placeholder="填写适配公司或公司类型">
          </label>

          <label class="record-field record-field-wide">
            <span>核心关键词</span>
            <input type="text" name="keywords" placeholder="例如：内容增长、达人合作、GMV、项目统筹">
          </label>
        </div>

        <section class="resume-section" aria-labelledby="resume-match-title">
          <div class="resume-section-head">
            <div class="resume-section-kicker">岗位匹配</div>
            <h3 id="resume-match-title">JD 匹配与优势</h3>
          </div>
          <div class="record-grid">
            <label class="record-field record-field-wide">
              <span>JD 匹配备注</span>
              <textarea name="jd-match-notes" placeholder="记录岗位要求、已匹配能力和需要补强的内容"></textarea>
            </label>
            <div class="record-field record-field-wide advantage-wrap">
              <span>优势标签</span>
              <div class="advantage-tags" aria-label="优势标签">
                <span class="advantage-tag">内容增长</span>
                <span class="advantage-tag">达人合作</span>
                <span class="advantage-tag">GMV 转化</span>
                <span class="advantage-tag">项目统筹</span>
              </div>
              <input type="text" name="advantage-tags" placeholder="补充优势标签，用逗号分隔">
            </div>
          </div>
        </section>

        <section class="resume-section" aria-labelledby="resume-project-title">
          <div class="resume-section-head">
            <div class="resume-section-kicker">项目经历</div>
            <h3 id="resume-project-title">项目经历记录</h3>
          </div>
          <div class="record-grid">
            <label class="record-field">
              <span>项目名称</span>
              <input type="text" name="project-name" placeholder="填写项目名称">
            </label>
            <label class="record-field">
              <span>项目角色</span>
              <input type="text" name="project-role" placeholder="填写负责角色">
            </label>
            <label class="record-field record-field-wide">
              <span>项目成果</span>
              <textarea name="project-results" placeholder="用数据记录项目动作、个人贡献和最终成果"></textarea>
            </label>
          </div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
