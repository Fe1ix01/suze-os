<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司研究模板 · Suze Flow</title>
  <link rel="stylesheet" href="career.css">
</head>
<body>
  <header class="career-header">
    <div class="career-topbar">
      <a class="career-back" href="../index.html#career">← 返回求职模式</a>
      <a class="career-brand" href="../index.html#career" aria-label="Suze Flow 求职模式">Suze <span>Flow</span></a>
    </div>
  </header>
  <main class="career-main">
    <section class="career-panel" aria-labelledby="pageTitle">
      <div class="career-page-head"><h1 id="pageTitle">公司研究模板</h1><p>整理目标公司信息，为岗位分析做准备。</p></div>
      <nav class="career-tabs" aria-label="求职内部导航">
        <a href="jobs.html">岗位</a>
        <a href="companies.html" aria-current="page">公司</a>
        <a href="resume.html">简历</a>
        <a href="interview.html">面试</a>
        <a href="apply.html">投递</a>
        <a href="cases.html">案例</a>
      </nav>
      <aside class="template-notice" aria-label="模板使用说明"><strong>公司研究模板 · 暂未接入独立保存</strong><p>输入仅用于本页临时整理，刷新或离开页面可能丢失。正式岗位、投递状态和面试记录请在 Job Radar 中管理。</p><a class="career-button" href="jobs.html#jobRecordsTitle">进入 Job Radar →</a></aside>



      <section class="record-card" aria-label="公司卡片模板" data-template="true">
        <div class="record-card-head company-card-head">
          <div>
            <div class="record-kicker">研究模板</div>
            <h2>公司档案</h2>
          </div>
          <label class="company-status">
            <span class="sr-only">公司状态</span>
            <select class="company-status-select" name="status">
              <option>未分析</option>
              <option>值得投递</option>
              <option>已投递</option>
              <option>面试中</option>
              <option>不考虑</option>
            </select>
          </label>
        </div>

        <div class="record-grid">
          <label class="record-field">
            <span>公司名称</span>
            <input type="text" name="company" placeholder="填写公司名称" autocomplete="organization">
          </label>

          <label class="record-field">
            <span>行业分类</span>
            <select name="industry">
              <option value="">选择行业</option>
              <option>互联网</option>
              <option>电商</option>
              <option>内容营销</option>
              <option>旅游</option>
              <option>消费品牌</option>
              <option>其他</option>
            </select>
          </label>

          <label class="record-field">
            <span>公司规模</span>
            <select name="company-size">
              <option value="">选择规模</option>
              <option>1–49 人</option>
              <option>50–199 人</option>
              <option>200–999 人</option>
              <option>1000–9999 人</option>
              <option>10000 人以上</option>
            </select>
          </label>

          <label class="record-field">
            <span>所在地区</span>
            <input type="text" name="location" placeholder="例如：广州 / 深圳" autocomplete="address-level2">
          </label>

          <label class="record-field record-field-wide">
            <span>官网</span>
            <input type="url" name="website" placeholder="https://..." inputmode="url">
          </label>

          <label class="record-field record-field-wide">
            <span>招聘链接</span>
            <input type="url" name="recruitment-link" placeholder="https://..." inputmode="url">
          </label>

          <label class="record-field">
            <span>目标岗位</span>
            <input type="text" name="target-role" placeholder="填写目标岗位" autocomplete="organization-title">
          </label>

          <label class="record-field">
            <span>匹配度评分</span>
            <input type="number" name="match-score" min="0" max="100" step="1" inputmode="numeric" placeholder="0–100">
          </label>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
