<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试准备模板 · Suze Flow</title>
  <link rel="stylesheet" href="career.css">
</head>
<body>
  <header class="career-header">
    <div class="career-topbar">
      <a class="career-back" href="../index.html#career">← 返回求职模式</a>
      <a class="career-brand" href="../index.html#career" aria-label="Suze Flow 求职模式">Suze <span>Flow</span></a>
    </div>
  </header>
  <main class="career-main">
    <section class="career-panel" aria-labelledby="pageTitle">
      <div class="career-page-head"><h1 id="pageTitle">面试准备模板</h1><p>准备面试问题、案例表达与复盘要点。</p></div>
      <nav class="career-tabs" aria-label="求职内部导航">
        <a href="jobs.html">岗位</a>
        <a href="companies.html">公司</a>
        <a href="resume.html">简历</a>
        <a href="interview.html" aria-current="page">面试</a>
        <a href="apply.html">投递</a>
        <a href="cases.html">案例</a>
      </nav>
      <aside class="template-notice" aria-label="模板使用说明"><strong>面试准备模板 · 暂未接入独立保存</strong><p>输入仅用于本页临时整理，刷新或离开页面可能丢失。正式岗位、投递状态和面试记录请在 Job Radar 中管理。</p><a class="career-button" href="jobs.html#jobRecordsTitle">进入 Job Radar →</a></aside>

      <section class="record-card" aria-label="面试记录卡片" data-template="true">
        <div class="record-card-head interview-card-head">
          <div>
            <div class="record-kicker">准备模板</div>
            <h2>面试准备草稿</h2>
          </div>
          <label class="interview-result">
            <span class="sr-only">结果状态</span>
            <select class="interview-result-select" name="result-status">
              <option>待反馈</option>
              <option>通过</option>
              <option>淘汰</option>
              <option>Offer</option>
            </select>
          </label>
        </div>

        <div class="record-grid">
          <label class="record-field">
            <span>公司名称</span>
            <input type="text" name="company" placeholder="填写公司名称" autocomplete="organization">
          </label>

          <label class="record-field">
            <span>岗位名称</span>
            <input type="text" name="position" placeholder="填写面试岗位" autocomplete="organization-title">
          </label>

          <label class="record-field">
            <span>面试日期</span>
            <input type="date" name="interview-date">
          </label>

          <label class="record-field">
            <span>面试阶段</span>
            <select name="interview-stage">
              <option>HR面</option>
              <option>一面</option>
              <option>二面</option>
              <option>终面</option>
              <option>Offer</option>
            </select>
          </label>
        </div>

        <div class="interview-stage-wrap">
          <div class="interview-stage-title">面试流程</div>
          <div class="interview-stages" aria-label="面试阶段">
            <span class="interview-stage interview-stage-active">HR 面</span>
            <span class="interview-stage">一面</span>
            <span class="interview-stage">二面</span>
            <span class="interview-stage">终面</span>
            <span class="interview-stage">Offer</span>
          </div>
        </div>

        <section class="interview-section" aria-labelledby="interview-question-title">
          <div class="interview-section-head">
            <div class="interview-section-kicker">面试问题</div>
            <h3 id="interview-question-title">面试问题记录</h3>
          </div>
          <label class="record-field record-field-wide">
            <span>问题与追问</span>
            <textarea class="interview-textarea" name="questions" placeholder="记录面试官提出的问题、追问和重点要求"></textarea>
          </label>
        </section>

        <section class="interview-section" aria-labelledby="interview-answer-title">
          <div class="interview-section-head">
            <div class="interview-section-kicker">回答思路</div>
            <h3 id="interview-answer-title">我的回答记录</h3>
          </div>
          <label class="record-field record-field-wide">
            <span>回答内容</span>
            <textarea class="interview-textarea" name="answers" placeholder="整理当时的回答逻辑、案例和数据表达"></textarea>
          </label>
        </section>

        <section class="interview-section" aria-labelledby="interview-review-title">
          <div class="interview-section-head">
            <div class="interview-section-kicker">复盘</div>
            <h3 id="interview-review-title">面试复盘</h3>
          </div>
          <div class="record-grid">
            <label class="record-field record-field-wide">
              <span>表现亮点</span>
              <textarea name="review-strengths" placeholder="记录回答清晰、案例有效或得到认可的部分"></textarea>
            </label>
            <label class="record-field record-field-wide">
              <span>改进方向</span>
              <textarea name="review-improvements" placeholder="记录回答不足、缺失信息和下一次改进动作"></textarea>
            </label>
          </div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
